[package]
name = "discord-bot"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "A Discord bot that grows its own personality: background AI agents remember people, form opinions and pick their own name"
repository = "https://github.com/krxi/discord-bot"

[dependencies]
serenity = { version = "0.12", features = ["cache"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync", "io-util"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
log = "0.4"
redb = "4"
rpassword = "7.5.4"
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
parking_lot = "=0.12.5"

[dev-dependencies]
serde_yaml = "=0.9.34"

# serenity is vendored (vendor/serenity, copied from crates.io 0.12.5) so it can be
# modified in-tree; the version requirement above still has to match it
[patch.crates-io]
serenity = { path = "vendor/serenity" }

[profile.release]
strip = true
lto = true
