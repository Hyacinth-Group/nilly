services:
  bot:
    image: ghcr.io/krxi/nibby:latest
    build: .
    restart: unless-stopped
    environment:
      PANEL_BIND: 0.0.0.0
      PANEL_PORT: "8787"
      PANEL_CONFIG_PATH: /data/config/.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - durum:/data/durum
      - nibby-config:/data/config
      - ./photos:/data/photos:ro
volumes:
  durum:
    name: nibby-data
  nibby-config:
    name: nibby-config
