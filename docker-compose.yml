services:
  bot:
    image: ghcr.io/krxi/discord-bot:latest
    build: .
    restart: unless-stopped
    environment:
      PANEL_BIND: 0.0.0.0
      PANEL_PORT: "8080"
      PANEL_CONFIG_PATH: /data/config/.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - durum:/data/durum
      - ./config:/data/config
      - ./photos:/data/photos:ro
volumes:
  durum:
    name: discord-bot-data
